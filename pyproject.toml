[project]
name = "DataInsight"
version = "0.1.0"
description = "数据洞察agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "langchain>=1.2.13",
    "langchain-openai>=0.2.0",
    "langchain-qwq>=0.3.4",
    "json-repair>=0.53.1",
    "pandas>=3.0.1",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "pyecharts>=2.1.0",
    "matplotlib>=3.10.8",
    "playwright>=1.52.0",
    "packaging>=24.0",
    "pip>=26.0.1",
    "reportlab>=4.4.10",
    "markdown-it-py>=4.0.0",
    "weasyprint>=67.0",
    "redis>=5.0.0",
    "pandas-stubs~=3.0.1",
    "sqlglot>=26.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
